<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>to zer0</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main class="app">
            <h1>Target to Zero</h1>

            <form id="goal-form">
                <div>
                    <label for="title">Title</label>
                    <input id="title" name="title" type="text" required />
                </div>

                <div>
                    <label for="duration">Duration in hours</label>
                    <input
                        id="duration"
                        name="duration"
                        type="number"
                        min="0.1"
                        step="0.1"
                        required
                    />
                </div>

                <button type="submit">Add study goal</button>
            </form>

            <h2>Goals</h2>

            <ul id="goal-list"></ul>
        </main>

        <script src="script.js"></script>
    </body>
</html>
